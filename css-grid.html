<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Layout</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      
      border: 5px solid red;
      background-color: gray;
    }

    .grid {
      display: grid;
      
      grid-template-columns: 1fr 2fr 1fr;
     
      row-gap: 5px;
      column-gap: 10px;
      
      padding: 10px;
    }

    .grid div {
      
      padding: 40px;
      text-align: center;
      font-size: 30px;
    }

    .topbar {
      border: 4px dotted red;
      background-color: royalblue;
      grid-area: 1 / 1 / span 1 / span 3;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .navigation {
      border: 4px dotted blue;
      grid-column: 1 / 2;
      grid-row: 3 / 4;
    }

    .content {
      border: 4px dotted blue;
      grid-column: 2 / 3;
      grid-row: 3 / 4;
    }

    .aside {
      border: 4px dotted blue;
      grid-column: 3 / 4;
      grid-row: 3 / 4;
    }

    .bottom {
      border: 4px dotted greenyellow;
      background-color: royalblue;
      grid-column: 1 / 4;
      grid-row: 4 / 5;
    }
  </style>

</head>

<body>

  <div class="grid">

    <div class="topbar">Website Banner</div>

    <div class="navigation">Navigation</div>

    <div class="content">Content Area</div>

    <div class="aside">News</div>

    <div class="bottom">Copyright 2026</div>

  </div>

</body>

</html>
