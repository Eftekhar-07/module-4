<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image</title>

  <style>
    img {
      max-width: 100%;
      height: auto;
    }
  </style>

</head>

<body>

  <img src="../images/nature.jpg" alt="Beautiful Nature">

  <p>
    One evening, Rafi went for a walk near a beautiful lake.
    The sky was clear, the trees were green, and the cool wind
    made him feel relaxed.
  </p>

</body>

</html>
